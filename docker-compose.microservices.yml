services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: sangu2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/platform/schema_v1.sql:/docker-entrypoint-initdb.d/00_platform_schema.sql
      - ./db/tenant/schema_v1.sql:/docker-entrypoint-initdb.d/01_tenant_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  booking-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        PROJECT_PATH: src/Sangu.Tms.BookingService/Sangu.Tms.BookingService.csproj
        SERVICE_DLL: Sangu.Tms.BookingService.dll
    ports:
      - "5001:5000"

  billing-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        PROJECT_PATH: src/Sangu.Tms.BillingService/Sangu.Tms.BillingService.csproj
        SERVICE_DLL: Sangu.Tms.BillingService.dll
    ports:
      - "5002:5000"

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        PROJECT_PATH: src/Sangu.Tms.PaymentService/Sangu.Tms.PaymentService.csproj
        SERVICE_DLL: Sangu.Tms.PaymentService.dll
    ports:
      - "5003:5000"

  master-data-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        PROJECT_PATH: src/Sangu.Tms.MasterDataService/Sangu.Tms.MasterDataService.csproj
        SERVICE_DLL: Sangu.Tms.MasterDataService.dll
    ports:
      - "5004:5000"

  reporting-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        PROJECT_PATH: src/Sangu.Tms.ReportingService/Sangu.Tms.ReportingService.csproj
        SERVICE_DLL: Sangu.Tms.ReportingService.dll
    ports:
      - "5005:5000"

  chat-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        PROJECT_PATH: src/Sangu.Tms.ChatService/Sangu.Tms.ChatService.csproj
        SERVICE_DLL: Sangu.Tms.ChatService.dll
    ports:
      - "5006:5000"
    environment:
      ConnectionStrings__TenantDb: "Host=postgres;Port=5432;Database=sangu2;Username=postgres;Password=postgres"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
